# west.yml: the Loom Foundation workspace manifest
#
# west is used here purely as a multi-repository workspace orchestrator
# (independent sibling checkouts). No Zephyr RTOS or build system
# functionality is used.
#
# Usage:
#   west init -l manifest       # one-time: register the workspace
#   west update -k -r           # clone or fast-forward all projects, keeping
#                               # checked-out branches instead of detaching HEAD
#   west manifest --freeze      # snapshot all revisions to SHAs

manifest:
  remotes:
    - name: origin
      url-base: https://github.com/loom-foundation

  defaults:
    remote: origin
    revision: main

  self:
    path: manifest

  projects:
    - name: .github
      path: .github
      description: "Organisation and community info page on Github."
      userdata:
        role: community

    - name: manifesto
      path: manifesto
      description: "The Loom Manifesto."
      userdata:
        role: governance

    - name: org
      path: org
      description: "The Loom Foundation: charter, stewardship, brand, trademarks."
      userdata:
        role: governance

    - name: app-manifesto-site
      path: apps/manifesto-site
      description: "The site that publishes the manifesto and its signatories at theloommanifesto.org."
      userdata:
        role: application
        protected: true

    - name: corpus-note-authoring
      path: corpora/note-authoring
      description: "Conventions and principles for authoring clear, concise, and maintainable notes."
      userdata:
        role: methodology

    - name: corpus-note
      path: corpora/note
      description: "Note: a methodology for capturing intent (needs, requirements, design) as plain-text, Git-native artifacts."
      userdata:
        role: methodology
        protected: true
        required-checks: [check]

    - name: app-note-docs-site
      path: apps/note-docs-site
      description: "The disposable VitePress renderer that builds the Note docs from corpora/note/docs into a static site."
      userdata:
        role: application
        protected: true

    - name: app-sett
      path: apps/sett
      description: "sett, the Note reference tool."
      userdata:
        role: application
        protected: true

    - name: skill-note
      path: skills/note
      description: "The note skill: a distilled operating guide to the Note method for agents."
      userdata:
        role: skill
        protected: true

    - name: site-manifesto
      path: sites/manifesto
      description: "The built static HTML of the manifesto site (theloommanifesto.org)."
      userdata:
        role: site

    - name: site-note-docs
      path: sites/note-docs
      description: "The built static HTML of the Note docs site."
      userdata:
        role: site
